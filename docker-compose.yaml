services:
  django:
    build: .
    container_name: image_processor_django

    environment:
      POSTGRES_DB: db-image-processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DemoOnly
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    volumes:
      - ./media:/app/media

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  db:
    image: postgres:18
    container_name: image_processor_db

    environment:
      POSTGRES_DB: db-image-processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DemoOnly

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-image-processor"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: image_processor_redis

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  celery_worker:
    build: .
    container_name: image_processor_celery_worker

    environment:
      POSTGRES_DB: db-image-processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DemoOnly
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0

    entrypoint: ./celery_entrypoint.sh

    volumes:
      - ./media:/app/media

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data: